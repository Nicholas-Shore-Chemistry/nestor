name: release

on:
  push:
    tags:
      - 'nestor--v*'
      - '!nestor--v*-dryrun'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan and check only, push nothing
        type: boolean
        default: true
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PUBLIC_REMOTE: git@github.com:Nicholas-Shore-Chemistry/nestor.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require deploy key
        if: env.DRY_RUN != 'true'
        env:
          PUBLIC_DEPLOY_KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
        run: |
          if [ -z "$PUBLIC_DEPLOY_KEY" ]; then
            echo "PUBLIC_DEPLOY_KEY is not set" >&2
            exit 1
          fi
      - name: Set up SSH
        if: env.DRY_RUN != 'true'
        env:
          PUBLIC_DEPLOY_KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$PUBLIC_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          hosts="$RUNNER_TEMP/known_hosts"
          gh api meta --jq '.ssh_keys[] | select(startswith("ssh-ed25519"))' | sed 's/^/github.com /' > "$hosts"
          if [ ! -s "$hosts" ]; then
            echo "no ed25519 host key found" >&2
            exit 1
          fi
          echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Release push
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node tools/release-push.mjs --remote "$PUBLIC_REMOTE" --tag "$TAG" --dry-run
          else
            node tools/release-push.mjs --remote "$PUBLIC_REMOTE" --tag "$TAG"
          fi
      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
