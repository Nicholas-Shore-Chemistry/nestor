name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Test
        run: npm test

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identity scan
        continue-on-error: ${{ vars.SCAN_ENFORCE != 'true' }}
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
          SCAN_ENFORCE: ${{ vars.SCAN_ENFORCE }}
        run: |
          if [ "$SCAN_ENFORCE" = "true" ]; then
            node tools/identity-scan.mjs --release --refs HEAD
          else
            node tools/identity-scan.mjs --refs HEAD
          fi
